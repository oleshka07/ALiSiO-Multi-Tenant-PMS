version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: alisio_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-alisio_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-alisio_secure_password_2026}
      POSTGRES_DB: ${DB_NAME:-alisio_pms}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-alisio_user} -d ${DB_NAME:-alisio_pms}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alisio_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-alisio_user}:${DB_PASSWORD:-alisio_secure_password_2026}@postgres:5432/${DB_NAME:-alisio_pms}
    depends_on:
      postgres:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: alisio_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@alisio.io}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin2026}
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
    driver: local
