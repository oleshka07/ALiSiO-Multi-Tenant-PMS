version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: alisio_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-alisio_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-alisio_secure_password_2026}
      POSTGRES_DB: ${DB_NAME:-alisio_pms}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-alisio_user} -d ${DB_NAME:-alisio_pms}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: alisio_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@alisio.io}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin2026}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
    driver: local
