# Local development helpers. The application itself runs with `npm run dev`;
# this file only provides the services it will talk to.
#
#   docker compose up -d postgres
#
# Deployment lives in deploy/ — see deploy/docker-compose.yml.
#
# Postgres is here ahead of the migration off SQLite. It mounted
# ./database/schema.sql and ./database/seed.sql, which described a schema the
# application never used and no longer exist; the real schema will arrive as
# generated migrations.

services:
  postgres:
    image: postgres:16-alpine
    container_name: alisio_dev_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-alisio}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-alisio_dev}
      POSTGRES_DB: ${DB_NAME:-alisio_pms}
    # 5433 on the host so a locally installed Postgres on 5432 still works.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-alisio} -d ${DB_NAME:-alisio_pms}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
