# Deploy what passed.
#
# Until now the last step of every change was a human typing
# `./deploy/deploy.sh prod` on the VPS. That is the step that decides whether
# a merged commit is actually running, and it was the one step nothing
# enforced — so "it is in main" and "it is live" could differ for days, and
# nothing said which.
#
# This closes it: when the `checks` workflow goes green, this connects to the
# server and runs the same deploy script. Not a second deploy path — the same
# one, invoked by a machine instead of by whoever remembered.
#
# ── The branch decides the environment ──────────────────────────────────────
#
#   main  →  prod   (alisio-prod)
#   beta  →  beta   (alisio-beta)
#
# One rule, no input to choose and so no way to choose wrong. It matches what
# deploy.sh already does: `./deploy/deploy.sh beta` checks out the beta branch,
# `prod` checks out main. Both environments share the VPS and each has its own
# compose project, port and database — see docs/DEPLOY.md.
#
# Beta exists to be the place a change is tried before a hotel sees it. That
# only works if beta is CURRENT: a beta ninety-six commits behind main tests
# nothing and quietly lies about what has been tried. Hence this deploys both,
# on the same trigger, from the same file.
#
# It runs AFTER checks rather than on push, on purpose. `on: push` would deploy
# a commit whose types have not compiled yet; by the time CI reported, the
# broken build would already be serving.
#
# ── What it needs from you, once ────────────────────────────────────────────
#
# Four repository secrets (Settings → Secrets and variables → Actions):
#
#   DEPLOY_HOST     the server, e.g. 203.0.113.10 or vps.example.com
#   DEPLOY_USER     the ssh user that owns the checkout
#   DEPLOY_SSH_KEY  a PRIVATE key whose public half is in that user's
#                   ~/.ssh/authorized_keys. Make a fresh one for this
#                   (`ssh-keygen -t ed25519 -C github-actions -N ""`) rather
#                   than reusing a personal key — this one can be revoked
#                   without locking you out.
#   DEPLOY_PATH     absolute path of the checkout on the server,
#                   e.g. /opt/alisio  — the DIRECTORY, not deploy/deploy.sh
#
# Both environments use the same four: one server, one checkout, two compose
# projects. What differs is `deploy/env.prod` and `deploy/env.beta` on the
# server, and those never leave it.
#
# Without the secrets the job does not fail — it says what is missing and
# stops. A red badge nobody can clear is a badge everybody learns to ignore.
name: deploy

# What the run list says.
#
# A workflow started by `workflow_run` always runs on the DEFAULT branch, so
# every deploy shows up as `main` in the list of runs no matter which
# environment it touched. That field is the workflow's own ref, not the branch
# that triggered it — and reading it as the latter is an easy mistake to make,
# because it looks exactly like the answer to the question you are asking.
# It cost one wrong diagnosis already: "beta never deployed", when beta had
# deployed successfully twice.
#
# The environment lives in `github.event.workflow_run.head_branch`, which the
# job below reads. Putting it in the run title too means the list answers the
# question without anyone opening a run and finding the job name.
run-name: >-
  ${{ (github.event.workflow_run.head_branch || github.ref_name) == 'beta' && 'beta' || 'prod' }}
  ← ${{ github.event.workflow_run.head_branch || github.ref_name }}

on:
  workflow_run:
    workflows: ['checks']
    types: [completed]
    branches: [main, beta]
  # Deploy the current branch by hand — after adding the secrets for the first
  # time, or to re-run a deploy that failed on the server rather than in CI.
  # Which environment is decided by the branch you dispatch from, exactly as
  # for an automatic run.
  workflow_dispatch:

concurrency:
  # Per environment. Two deploys of the same one would race on its working
  # copy and its database backup; prod and beta have no reason to wait for
  # each other.
  group: deploy-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    # The environment in the job name, so the run list says which one this was
    # without opening it.
    name: ${{ (github.event.workflow_run.head_branch || github.ref_name) == 'beta' && 'beta' || 'prod' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # A manual run has no workflow_run to inspect; a triggered one must have
    # passed. Deploying a commit whose checks failed is the thing this guards.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: which environment
        id: env
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          case "$BRANCH" in
            main) echo "name=prod" >> "$GITHUB_OUTPUT" ;;
            beta) echo "name=beta" >> "$GITHUB_OUTPUT" ;;
            *)
              # A dispatch from a feature branch. Refusing is the point: there
              # is no environment for it, and deploying it to one of the two
              # that exist would overwrite something a person is using.
              echo "::error::no environment is bound to branch '$BRANCH' — deploy from main or beta"
              exit 1 ;;
          esac

      - name: are the deploy secrets set
        id: gate
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DPATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          missing=()
          [ -n "$HOST" ]  || missing+=(DEPLOY_HOST)
          [ -n "$USER" ]  || missing+=(DEPLOY_USER)
          [ -n "$KEY" ]   || missing+=(DEPLOY_SSH_KEY)
          [ -n "$DPATH" ] || missing+=(DEPLOY_PATH)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "ready=no" >> "$GITHUB_OUTPUT"
            {
              echo "### Деплой не налаштований"
              echo
              echo "Немає секретів: \`${missing[*]}\`."
              echo
              echo "Settings → Secrets and variables → Actions → New repository secret."
              echo "Що саме в кожен — у шапці \`.github/workflows/deploy.yml\`."
              echo
              echo "Поки їх немає, деплой лишається ручним:"
              echo '```'
              echo "cd <шлях> && ./deploy/deploy.sh ${{ steps.env.outputs.name }}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::deploy secrets are not set — skipping, see the job summary"
          else
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: authorise against the server
        if: steps.gate.outputs.ready == 'yes'
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Pin the host key on first contact and keep it. Without this, ssh
          # either refuses (no known_hosts) or accepts anything — and "accepts
          # anything" is how a deploy lands on a machine that answered instead
          # of the one you meant.
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: deploy
        if: steps.gate.outputs.ready == 'yes'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          DPATH: ${{ secrets.DEPLOY_PATH }}
          ENV_NAME: ${{ steps.env.outputs.name }}
        run: |
          # deploy.sh does its own fetch/reset to the branch this environment
          # follows, backs the database up, builds, applies pending migrations
          # and restarts. It exits non-zero if the backup is empty, if a
          # migration fails, or if the new container does not answer on a
          # database-backed route — so its exit code is the honest answer to
          # "is it live".
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes \
              "$USER@$HOST" \
              "cd '$DPATH' && ./deploy/deploy.sh '$ENV_NAME'"

      - name: say what happened
        if: always() && steps.gate.outputs.ready == 'yes'
        env:
          ENV_NAME: ${{ steps.env.outputs.name }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "### $ENV_NAME оновлено до \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Деплой $ENV_NAME не пройшов"
              echo
              echo "Стара версія лишилась працювати: deploy.sh піднімає нову"
              echo "тільки після успішної збірки й міграцій. Лог кроку \`deploy\`"
              echo "вище каже, на чому саме зупинилось."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
