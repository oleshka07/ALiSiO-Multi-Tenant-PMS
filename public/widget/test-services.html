<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Service Widget Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, system-ui, sans-serif; background: #f0f2f5; padding: 32px; }
    h1 { text-align: center; font-size: 24px; margin-bottom: 8px; color: #1a1a2e; }
    .subtitle { text-align: center; color: #6b7280; margin-bottom: 32px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 24px; max-width: 1300px; margin: 0 auto; }
    .section { background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,.06); }
    .section h2 { font-size: 16px; font-weight: 600; color: #6b7280; margin-bottom: 16px; text-transform: uppercase; letter-spacing: 1px; }
  </style>
</head>
<body>
  <h1>🧩 ALiSiO Service Widgets</h1>
  <p class="subtitle">Test page — widgets fetch data from localhost:3002</p>

  <div class="grid">
    <div class="section">
      <h2>🔥 Sauna Widget</h2>
      <div id="alisio-service-widget"></div>
      <script
        src="http://localhost:3002/widget/service-embed.js"
        data-service="sauna"
        data-lang="uk"
        data-color="#1a1a2e"
      ></script>
    </div>

    <div class="section">
      <h2>🛁 Tub Widget</h2>
      <div id="alisio-service-widget-tub"></div>
    </div>

    <div class="section">
      <h2>🍳 Breakfast Widget</h2>
      <div id="alisio-service-widget-breakfast"></div>
    </div>
  </div>

  <!-- Additional widgets need separate IDs — we'll load them via additional scripts -->
  <script>
    // Load tub widget manually (since only one script tag can use document.currentScript)
    setTimeout(function() {
      var s = document.createElement('script');
      s.src = 'http://localhost:3002/widget/service-embed.js';
      s.setAttribute('data-service', 'tub');
      s.setAttribute('data-lang', 'uk');
      s.setAttribute('data-color', '#2563eb');
      // Override container ID
      window.__ALISIO_SERVICE_CONTAINER = 'alisio-service-widget-tub';
      document.body.appendChild(s);
    }, 500);

    setTimeout(function() {
      var s = document.createElement('script');
      s.src = 'http://localhost:3002/widget/service-embed.js';
      s.setAttribute('data-service', 'breakfast');
      s.setAttribute('data-lang', 'uk');
      s.setAttribute('data-color', '#16a34a');
      window.__ALISIO_SERVICE_CONTAINER = 'alisio-service-widget-breakfast';
      document.body.appendChild(s);
    }, 1000);
  </script>
</body>
</html>
