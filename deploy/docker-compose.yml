# One compose file, one environment per env-file.
#
#   docker compose --env-file env.prod -p alisio-prod up -d --build
#   docker compose --env-file env.beta -p alisio-beta up -d --build
#
# The project name (-p) keeps the two stacks' containers, networks and volumes
# apart, so beta can be rebuilt or wiped without touching production.
#
# Note the data volume. The application stores its database in /app/data; the
# previous configuration mounted nothing there, so every container restart
# silently discarded every booking. Never remove it.

services:
  app:
    # Kept for the manual fallback only.
    #
    # `docker compose up` builds from this stanza when the named image is not
    # already present, and uses the image when it is. So with APP_IMAGE set to
    # something `deploy.sh` has just pulled, nothing is built here; without it,
    # a person on the server still gets the old behaviour by typing the same
    # command they always typed.
    build:
      context: ..
      dockerfile: Dockerfile
    # Which image runs.
    #
    # The default is the locally built tag, which is what a manual
    # `./deploy/deploy.sh prod` still produces. CI sets APP_IMAGE to the exact
    # digest-bearing tag it built from the commit that passed `checks`, and
    # then the server never compiles anything — see the header of
    # .github/workflows/deploy.yml for why that matters.
    image: ${APP_IMAGE:-alisio-pms:${ENV_NAME}}
    container_name: alisio-${ENV_NAME}-app
    restart: unless-stopped
    # Bound to loopback: nginx terminates TLS and is the only way in.
    ports:
      - "127.0.0.1:${APP_PORT}:3000"
    # The whole environment file, not a hand-kept list of it.
    #
    # `--env-file` on the command line feeds compose's own interpolation; it
    # does NOT put anything inside the container. That was the list below, and
    # it had drifted: CRON_SECRET, HOSTEX_WEBHOOK_SECRET and ICAL_CRON_SECRET
    # were never passed, so inside the container they were permanently
    # undefined and the routes that guard on them fell back to `|| 'local-cron'`
    # — a password printed in the source — or to `if (!SECRET) return true`.
    # Anyone on the internet could run the crons. OPENAI_API_KEY was in the
    # env-file template all along, which is worse than missing: the operator
    # filled it in, saw it in the file, and translations still never ran.
    #
    # A whitelist of environment variables has to be edited every time the
    # application learns a new one, and nothing fails when somebody forgets.
    # This passes the file the operator actually maintains.
    env_file:
      - env.${ENV_NAME}
    # Derived values stay explicit — an entry here wins over the file, which is
    # what keeps NODE_ENV and the public mirror of APP_URL from being editable
    # by accident.
    environment:
      NODE_ENV: production
      ENV_NAME: ${ENV_NAME}
      APP_URL: ${APP_URL}
      NEXT_PUBLIC_APP_URL: ${APP_URL}
      # Which engine. Empty means SQLite, which is what both environments ran
      # on for their whole life; `postgres` switches, and only then does
      # DATABASE_URL mean anything. Two variables on purpose — DATABASE_URL was
      # left in these env files by a scaffold, pointing at a server that did not
      # exist, so keying the engine on it alone would have switched a live
      # install the moment the Postgres driver shipped.
      DB_DRIVER: ${DB_DRIVER:-}
      DATABASE_URL: ${DATABASE_URL:-}
    volumes:
      - app-data:/app/data
      - app-uploads:/app/public/uploads
    # A ceiling, because the host is 4 GB shared with unrelated projects and
    # the OOM killer goes for the fattest process — which is prod's Postgres.
    # Without limits one hungry neighbour takes everyone down; with them the
    # hungry container is the one that dies. Tune per environment in the env
    # file; the defaults leave room for two stacks plus the neighbours.
    mem_limit: ${APP_MEM_LIMIT:-900m}
    mem_reservation: ${APP_MEM_RESERVATION:-256m}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Started only when asked for:
  #   docker compose ... --profile postgres up -d
  # An environment still on SQLite does not run it at all, so adding this
  # service to the file changes nothing until someone opts in. The application
  # does NOT depend_on it, for the same reason — a compose file that starts a
  # database nobody reads is how a "we are still on SQLite" environment quietly
  # grows a second one.
  postgres:
    profiles: ["postgres"]
    image: postgres:16-alpine
    container_name: alisio-${ENV_NAME}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_SUPERUSER:-alisio_admin}
      POSTGRES_PASSWORD: ${PG_SUPERUSER_PASSWORD}
      POSTGRES_DB: ${PG_DATABASE:-alisio}
    # Loopback, and a per-environment port so beta and prod never share one.
    ports:
      - "127.0.0.1:${PG_PORT}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    # Postgres gets its own ceiling for the same reason, sized well above its
    # default shared_buffers (128 MB) so the limit is a fence, not a noose.
    mem_limit: ${PG_MEM_LIMIT:-640m}
    mem_reservation: ${PG_MEM_RESERVATION:-256m}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_SUPERUSER:-alisio_admin} -d ${PG_DATABASE:-alisio}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  app-data:
  app-uploads:
  # Separate from app-data on purpose: the SQLite file stays where it is after
  # the move, untouched, which is what makes removing DB_DRIVER a real rollback
  # rather than a hope.
  pg-data:
