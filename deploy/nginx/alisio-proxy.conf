# Shared proxy settings. Install at /etc/nginx/snippets/alisio-proxy.conf.
#
# X-Forwarded-Proto matters: without it the application builds http:// links
# behind the TLS terminator, and browsers block them as mixed content.

proxy_pass_request_headers on;
proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# Websocket / SSE upgrade
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# Channel syncs and PDF generation can outlast the 60s default.
proxy_connect_timeout 10s;
proxy_send_timeout    120s;
proxy_read_timeout    120s;

proxy_buffering off;
