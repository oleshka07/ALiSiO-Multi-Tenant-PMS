# nginx front for both environments.
#
# Place at /etc/nginx/sites-available/alisio.conf and symlink into
# sites-enabled. Certificates come from certbot:
#   certbot --nginx -d pms.example.com -d beta.pms.example.com
#
# Replace pms.example.com with the real domain before enabling.

# Required by the proxy snippet's Connection header. Defined once here rather
# than in the snippet, which is included per-location and would collide.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── Production ───────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name pms.example.com;
    # certbot rewrites this to a 301 once certificates exist
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pms.example.com;

    ssl_certificate     /etc/letsencrypt/live/pms.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pms.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Guests upload passport scans through the registration page.
    client_max_body_size 25m;

    # Знімок бази Winhotel від агента на сервері готелю: gzip на ~80 МБ
    # (докладно — docs/DEPLOY.md, «Міст Winhotel»). Ліміт лише на цей шлях;
    # решта лишається 25m. `=` — рівно цей адрес, без піддерев.
    location = /api/apps/winhotel-import/snapshots {
        client_max_body_size 200m;
        proxy_pass http://127.0.0.1:3130;
        include /etc/nginx/snippets/alisio-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:3130;
        include /etc/nginx/snippets/alisio-proxy.conf;
    }
}

# ── Beta ─────────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name beta.pms.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name beta.pms.example.com;

    ssl_certificate     /etc/letsencrypt/live/beta.pms.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beta.pms.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 25m;

    # Staging carries copies of real guest data. Keep it out of search results.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Знімок бази Winhotel від агента на сервері готелю: gzip на ~80 МБ
    # (докладно — docs/DEPLOY.md, «Міст Winhotel»). Ліміт лише на цей шлях;
    # решта лишається 25m. `=` — рівно цей адрес, без піддерев.
    location = /api/apps/winhotel-import/snapshots {
        client_max_body_size 200m;
        proxy_pass http://127.0.0.1:3131;
        include /etc/nginx/snippets/alisio-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:3131;
        include /etc/nginx/snippets/alisio-proxy.conf;
    }
}
